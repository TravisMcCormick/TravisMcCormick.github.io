name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Monthly rebuild so Goodreads shelf changes appear without a commit.
  # Run it manually (workflow_dispatch) any time you want it sooner.
  # Note: GitHub disables scheduled workflows after 60 days with no repo
  # activity - re-enable it from the Actions tab if that happens.
  schedule:
    - cron: "17 11 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one production deploy finish before starting the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
